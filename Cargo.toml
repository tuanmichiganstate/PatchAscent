[workspace]
resolver = "2"
members = [
  "apps/peakctl",
  "apps/desktop/src-tauri",
  "crates/midi-messages",
  "crates/midi-transport",
  "crates/peak-domain",
  "crates/peak-protocol",
  "crates/peak-sync",
  "crates/peak-sysex",
  "crates/peak-library",
  "crates/fake-peak",
]
default-members = [
  "apps/peakctl",
  "crates/midi-messages",
  "crates/midi-transport",
  "crates/peak-domain",
  "crates/peak-protocol",
  "crates/peak-sync",
  "crates/peak-sysex",
  "crates/peak-library",
  "crates/fake-peak",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["PatchAscent contributors"]
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1.3"
ctrlc = "3.4"
hex = "0.4"
midir = "0.11.0"
parking_lot = "0.12"
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

patchascent-midi-messages = { path = "crates/midi-messages" }
patchascent-midi-transport = { path = "crates/midi-transport" }
patchascent-peak-domain = { path = "crates/peak-domain" }
patchascent-peak-library = { path = "crates/peak-library" }
patchascent-peak-protocol = { path = "crates/peak-protocol" }
patchascent-peak-sync = { path = "crates/peak-sync" }
patchascent-peak-sysex = { path = "crates/peak-sysex" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
