[package]
name = "patchascent-desktop"
description = "PatchAscent Tauri diagnostics shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "patchascent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "patchascent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
parking_lot.workspace = true
patchascent-midi-messages.workspace = true
patchascent-midi-transport.workspace = true
patchascent-peak-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
uuid.workspace = true

[lints]
workspace = true
